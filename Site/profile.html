<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моят Профил | SkyTickets</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.1);
            --border: rgba(255, 255, 255, 0.2);
            --text: #ffffff;
            --text-dim: #cbd5e1;
            --accent: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        body { 
            font-family: 'Outfit', sans-serif; 
            margin: 0; color: var(--text);
            background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #1a1a2e);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- НОВАТА РАЗДЕЛЕНА НАВИГАЦИЯ --- */
        nav { 
            background: rgba(15, 12, 41, 0.6);
            backdrop-filter: blur(12px);
            height: 80px; padding: 0 5%;
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 100;
        }

        .nav-left { display: flex; align-items: center; gap: 40px; }
        .logo-container {
    display: flex;
    align-items: center; /* Центрира логото и текста вертикално */
    gap: 10px; /* Добавя разстояние между логото и текста */
    text-decoration: none; /* Премахва долната черта от контейнера */
}

.logo-img {
    height: 35px; /* Регулира височината на логото. Можеш да я промениш по твой вкус */
    width: auto; /* Запазва съотношението на страните на изображението */
}

.logo-text {
    font-size: 24px;
    font-weight: 700;
    color: white;
    letter-spacing: -1px;
    /* Наследяваме стиловете на старата .logo класа, за да запазим вида на текста */
}
        .main-menu { display: flex; gap: 25px; }
        .main-menu a { text-decoration: none; color: var(--text-dim); transition: 0.3s; font-weight: 500; font-size: 15px; }
        .main-menu a:hover { color: white; }

        .nav-right { display: flex; align-items: center; gap: 20px; }
        #user-display { font-size: 14px; }
        #btn-logout {
            background: rgba(255, 71, 87, 0.2); color: #ff4757; 
            border: 1px solid #ff4757; padding: 6px 18px; 
            border-radius: 20px; cursor: pointer; font-family: inherit; font-size: 13px;
        }
        #btn-logout:hover { background: #ff4757; color: white; }

        /* --- ПРОФИЛ КАРТА --- */
        .container { 
            max-width: 600px; 
            margin: 60px auto; 
            padding: 0 20px; 
        }

        .profile-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            text-align: center;
        }

        .avatar {
            width: 100px;
            height: 100px;
            background: var(--accent);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            margin: 0 auto 20px;
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.5);
        }

        .profile-name {
            font-size: 28px;
            font-weight: 700;
            margin: 0 0 5px 0;
            color: white;
        }

        .profile-role {
            font-size: 14px;
            color: #a5b4fc;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 30px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            text-align: left;
            background: rgba(0,0,0,0.2);
            padding: 25px;
            border-radius: 16px;
        }

        .info-item {
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 15px;
        }
        
        .info-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .info-label {
            font-size: 12px;
            color: var(--text-dim);
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 18px;
            font-weight: 500;
            color: white;
        }

       @media (max-width: 950px) {
            /* 1. ОПРАВЯМЕ МЕНЮТО (Вече го знаеш наизуст) */
            nav { flex-direction: column !important; height: auto !important; padding: 15px !important; gap: 15px !important; }
            .nav-left { flex-direction: column !important; gap: 15px !important; width: 100% !important; }
            .main-menu { flex-wrap: wrap !important; justify-content: center !important; gap: 15px !important; font-size: 15px !important; }
            .nav-right { width: 100% !important; justify-content: center !important; flex-wrap: wrap !important; gap: 10px !important; }

            /* 2. ОСНОВНИЯТ КОНТЕЙНЕР НА ПРОФИЛА */
            /* Хващам най-честите имена на класове */
            .container, .profile-container, .wrapper {
                width: 100% !important;
                padding: 15px !important;
                margin: 20px auto !important;
                box-sizing: border-box !important;
            }

            /* 3. КУТИИТЕ В ПРОФИЛА (Данни, Смяна на парола и т.н.) */
            .glass-panel, .profile-box, .profile-card, .profile-form {
                display: flex !important;
                flex-direction: column !important;
                width: 100% !important;
                max-width: 100% !important;
                padding: 20px !important;
                margin-bottom: 20px !important;
                box-sizing: border-box !important;
            }

            /* 4. АКО ИМА СНИМКА И ИНФО ЕДНО ДО ДРУГО -> СЛАГАМЕ ГИ ЕДНО ПОД ДРУГО */
            .profile-header, .user-info-row {
                display: flex !important;
                flex-direction: column !important;
                align-items: center !important;
                text-align: center !important;
                gap: 15px !important;
            }

            /* 5. ИНПУТ ПОЛЕТАТА (да са удобни за натискане с пръст) */
            .glass-panel input, .profile-form input, 
            .glass-panel button, .profile-form button {
                width: 100% !important;
                box-sizing: border-box !important;
                margin-bottom: 10px !important;
            }
        }
    </style>
</head>
<body>

<nav>
    <div class="nav-left">
        <a href="index.html" class="logo-container">
    <img src="/images/logo.png" alt="SkyTickets" class="logo-img">
    <span class="logo-text">SkyTickets</span>
        <div class="main-menu">
            <a href="index.html">Търсене</a>
            <a href="my-tickets.html">Моите билети</a>
            <a href="aboutus.html">За нас</a>
            <a href="contacts.html">Контакти</a>
        </div>
    </div>

    <div class="nav-right">
        <a href="admin.html" id="admin-btn" style="display: none; color: #a5b4fc; text-decoration: none; font-weight: 500;">Админ</a>
        <span id="user-display"></span>
        <button id="btn-logout" style="display: none;">Изход</button>
    </div>
</nav>

<div class="container">
    <div class="profile-card">
        <div class="avatar">👤</div>
        <h1 class="profile-name" id="prof-name">Зареждане...</h1>
        <div class="profile-role" id="prof-role">Потребител</div>

        <div class="info-grid">
            <div class="info-item">
                <div class="info-label">Имейл адрес</div>
                <div class="info-value" id="prof-email">...</div>
            </div>
            <div class="info-item">
                <div class="info-label">Телефонен номер</div>
                <div class="info-value" id="prof-phone">...</div>
            </div>
            <div class="info-item">
                <div class="info-label">Дата на раждане</div>
                <div class="info-value" id="prof-dob">...</div>
            </div>
            <div class="info-item">
                <div class="info-label">Пол</div>
                <div class="info-value" id="prof-gender">...</div>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { auth, db } from './firebase-config.js';
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

    onAuthStateChanged(auth, async (user) => {
        const d = document.getElementById('user-display');
        const out = document.getElementById('btn-logout');
        const adm = document.getElementById('admin-btn');

        if (user) {
            // 1. Попълване на навигацията
            d.innerHTML = `<a href="profile.html" style="color:white; text-decoration:none; font-weight:bold;">👤 ${user.email.split('@')[0]}</a>`;
            out.style.display = "block";

            // 2. Взимане на данните от базата данни
            try {
                const u = await getDoc(doc(db, "users", user.uid));
                
                if (u.exists()) {
                    const data = u.data();
                    
                    // Показваме бутона Админ, ако потребителят е такъв
                    if (data.role === "admin") {
                        adm.style.display = "inline-block";
                        document.getElementById('prof-role').innerText = "Администратор";
                        document.getElementById('prof-role').style.color = "#ff4757";
                    }

                    // Попълваме профилната карта
                    document.getElementById('prof-name').innerText = `${data.firstName || ''} ${data.lastName || ''}`;
                    document.getElementById('prof-email').innerText = data.email || user.email;
                    document.getElementById('prof-phone').innerText = data.phone || 'Няма въведен';
                    document.getElementById('prof-dob').innerText = data.birthDate || 'Няма въведена';
                    
                    // Превеждаме пола на български
                    let genderBg = 'Не е посочен';
                    if (data.gender === 'male') genderBg = 'Мъж';
                    if (data.gender === 'female') genderBg = 'Жена';
                    if (data.gender === 'other') genderBg = 'Друго';
                    document.getElementById('prof-gender').innerText = genderBg;
                }
            } catch(e) {
                console.error("Грешка при изтегляне на данните:", e);
                document.getElementById('prof-name').innerText = "Грешка при зареждане";
            }

        } else {
            // Ако потребителят не е влязъл, го пренасочваме към Вход
            window.location.href = "login.html";
        }
    });

    // Логика за бутона Изход
    document.getElementById('btn-logout').onclick = () => signOut(auth).then(() => location.reload());
</script>

</body>
</html>
