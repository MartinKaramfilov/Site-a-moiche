<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моят Профил | SkyTickets</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.1);
            --border: rgba(255, 255, 255, 0.2);
            --text: #ffffff;
            --text-dim: #cbd5e1;
            --accent: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        body { 
            font-family: 'Outfit', sans-serif; margin: 0; color: var(--text);
            background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #1a1a2e);
            background-size: 400% 400%; animation: gradientBG 15s ease infinite; min-height: 100vh;
        }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        nav { background: rgba(15, 12, 41, 0.6); backdrop-filter: blur(12px); height: 80px; padding: 0 8%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        .logo { font-size: 26px; font-weight: 700; color: white; text-decoration: none; }
        .nav-links a { text-decoration: none; color: var(--text-dim); margin-left: 25px; transition: 0.3s; font-weight: 500; }
        .nav-links a:hover { color: white; }

        .container { max-width: 800px; margin: 60px auto; padding: 0 20px; }

        /* ПРОФИЛНА КАРТА */
        .profile-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px;
            display: flex;
            gap: 40px;
            align-items: flex-start;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        /* ЛЯВА ЧАСТ (АВАТАР) */
        .profile-left { text-align: center; flex: 1; }
        .avatar {
            width: 120px; height: 120px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 50px; color: white; font-weight: bold;
            margin: 0 auto 20px;
            border: 4px solid rgba(255,255,255,0.1);
        }
        .role-badge {
            background: rgba(255,255,255,0.1); padding: 5px 15px; border-radius: 20px;
            font-size: 12px; text-transform: uppercase; letter-spacing: 1px;
        }

        /* ДЯСНА ЧАСТ (ДАННИ) */
        .profile-right { flex: 2; }
        h2 { margin: 0 0 20px 0; font-size: 32px; }
        
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .info-item {
            background: rgba(0,0,0,0.2);
            padding: 15px; border-radius: 12px;
        }
        .label { font-size: 12px; color: #a5b4fc; text-transform: uppercase; margin-bottom: 5px; display: block; }
        .value { font-size: 16px; font-weight: 500; }

        .btn-edit {
            margin-top: 30px;
            background: var(--glass); border: 1px solid var(--border);
            color: white; padding: 10px 20px; border-radius: 10px; cursor: pointer;
            transition: 0.3s;
        }
        .btn-edit:hover { background: rgba(255,255,255,0.2); }

        @media (max-width: 700px) {
            .profile-card { flex-direction: column; text-align: center; }
            .info-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<nav>
    <a href="index.html" class="logo">SkyTickets</a>
    <div class="nav-links">
        <a href="index.html">Търсене</a>
        <a href="my-tickets.html">Моите билети</a>
        <a href="aboutus.html">За нас</a>
        <button id="btn-logout" style="background: rgba(255, 71, 87, 0.2); color:#ff4757; border:1px solid #ff4757; padding:5px 15px; border-radius:20px; margin-left:10px; cursor:pointer;">Изход</button>
    </div>
</nav>

<div class="container">
    <div class="profile-card">
        <div class="profile-left">
            <div class="avatar" id="avatar-letter">?</div>
            <div class="role-badge" id="role-display">User</div>
            <p style="margin-top: 15px; color: #cbd5e1; font-size: 14px;" id="email-display">...</p>
        </div>

        <div class="profile-right">
            <h2 id="full-name">Зареждане...</h2>
            
            <div class="info-grid">
                <div class="info-item">
                    <span class="label">Телефон</span>
                    <span class="value" id="p-phone">-</span>
                </div>
                <div class="info-item">
                    <span class="label">Дата на раждане</span>
                    <span class="value" id="p-birth">-</span>
                </div>
                <div class="info-item">
                    <span class="label">Пол</span>
                    <span class="value" id="p-gender">-</span>
                </div>
                <div class="info-item">
                    <span class="label">Пощенски код</span>
                    <span class="value" id="p-postal">-</span>
                </div>
                
            </div>
            
            <button class="btn-edit" onclick="alert('Редакцията ще бъде достъпна скоро!')">✏️ Редактирай профил</button>
        </div>
    </div>
</div>

<script type="module">
    import { auth, db } from './firebase-config.js';
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

    onAuthStateChanged(auth, async (user) => {
        if (!user) {
            window.location.href = "login.html";
            return;
        }

        // Зареждане на данните
        try {
            const userDoc = await getDoc(doc(db, "users", user.uid));
            
            if (userDoc.exists()) {
                const data = userDoc.data();
                
                // Име
                const firstName = data.firstName || "Без име";
                const lastName = data.lastName || "";
                document.getElementById('full-name').innerText = `${firstName} ${lastName}`;
                
                // Аватар (Първа буква)
                document.getElementById('avatar-letter').innerText = firstName.charAt(0).toUpperCase();

                // Други данни
                document.getElementById('email-display').innerText = user.email;
                document.getElementById('p-phone').innerText = data.phone || "Няма";
                document.getElementById('p-birth').innerText = data.birthDate || "Няма";
                document.getElementById('p-gender').innerText = translateGender(data.gender);
                document.getElementById('p-postal').innerText = data.postalCode || "Няма";
                document.getElementById('role-display').innerText = (data.role || "user").toUpperCase();
            }
        } catch (e) {
            console.error("Error fetching profile:", e);
        }
    });

    function translateGender(g) {
        if(g === 'male') return 'Мъж';
        if(g === 'female') return 'Жена';
        if(g === 'other') return 'Друго';
        return g || '-';
    }

    document.getElementById('btn-logout').onclick = () => signOut(auth).then(() => window.location.href = "login.html");
</script>

</body>
</html>
