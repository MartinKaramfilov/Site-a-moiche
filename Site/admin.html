<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | SkyTickets</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.1);
            --border: rgba(255, 255, 255, 0.2);
            --text: #ffffff;
            --accent: #667eea;
            --danger: #ff4757;
            --success: #2ed573;
        }

        body { 
            font-family: 'Outfit', sans-serif; 
            margin: 0; color: var(--text);
            background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #1a1a2e);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        nav { 
            background: rgba(15, 12, 41, 0.6);
            backdrop-filter: blur(12px);
            height: 80px; padding: 0 8%;
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 1px solid var(--border);
        }
        .logo { font-size: 24px; font-weight: 700; color: white; text-decoration: none; }
        .nav-links a { color: #cbd5e1; text-decoration: none; margin-left: 20px; transition: 0.3s; }
        .nav-links a:hover { color: white; }

        .container { max-width: 1100px; margin: 50px auto; padding: 0 20px; }
        
        h1, h2 { text-align: center; margin-bottom: 30px; text-shadow: 0 0 20px rgba(165, 180, 252, 0.5); }
        h2 { margin-top: 60px; border-top: 1px solid var(--border); padding-top: 40px; }

        /* ADMIN FORM */
        .admin-panel {
            background: var(--glass);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            padding: 30px; border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .ticket-type-selector {
            display: flex; gap: 20px; margin-bottom: 25px;
            padding-bottom: 20px; border-bottom: 1px solid var(--border);
        }
        .radio-label { display: flex; align-items: center; cursor: pointer; font-weight: 500; }
        .radio-label input { width: 18px; height: 18px; margin-right: 10px; cursor: pointer; }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        input { 
            width: 100%; padding: 12px; 
            background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 10px;
            color: white; font-family: inherit; outline: none; box-sizing: border-box;
        }
        input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
        input:focus { border-color: var(--accent); }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #cbd5e1; }

        .btn-add {
            background: var(--accent); color: white; border: none; padding: 15px; 
            border-radius: 10px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 20px;
            transition: 0.3s;
        }
        .btn-add:hover { filter: brightness(1.2); }

        /* СПИСЪК С ПОЛЕТИ */
        .flight-list { margin-top: 30px; }
        .flight-item {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            padding: 20px; border-radius: 12px; margin-bottom: 15px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .flight-info h3 { margin: 0 0 5px 0; font-size: 20px; }
        .flight-details { font-size: 14px; color: #cbd5e1; }
        
        .type-badge {
            display: inline-block; padding: 3px 8px; border-radius: 4px; 
            font-size: 11px; font-weight: 700; text-transform: uppercase; margin-bottom: 5px;
        }
        .badge-round { background: #667eea; color: white; }
        .badge-one { background: #a5b4fc; color: #0f0c29; }

        /* ТАБЛИЦА ЗА ПОРЪЧКИ */
        .orders-table {
            width: 100%; border-collapse: collapse; margin-top: 20px;
            background: rgba(0,0,0,0.2); border-radius: 12px; overflow: hidden;
        }
        .orders-table th, .orders-table td {
            padding: 15px; text-align: left; border-bottom: 1px solid var(--border);
            font-size: 14px; vertical-align: middle;
        }
        .orders-table th { background: rgba(255,255,255,0.05); color: #a5b4fc; text-transform: uppercase; font-size: 12px; }
        .orders-table tr:hover { background: rgba(255,255,255,0.03); }
        .orders-table td { color: #cbd5e1; }
        
        .customer-name { color: white; font-weight: 700; display: block; font-size: 15px;}
        .flight-times { 
            color: #a5b4fc; font-weight: 700; display: block; margin-top: 6px; font-size: 13px; 
            background: rgba(102, 126, 234, 0.1); padding: 4px 8px; border-radius: 4px; width: fit-content;
        }

        .delete-btn {
            background: rgba(255, 71, 87, 0.2); color: var(--danger); border: 1px solid var(--danger);
            padding: 5px 10px; border-radius: 6px; cursor: pointer; transition: 0.3s; font-size: 12px;
        }
        .delete-btn:hover { background: var(--danger); color: white; }

        @media (max-width: 800px) {
            .orders-table { display: block; overflow-x: auto; }
        }
    </style>
</head>
<body>

<nav>
    <a href="index.html" class="logo">SkyTickets Admin</a>
    <div class="nav-links">
        <a href="aboutus.html">За нас</a>
        <a href="index.html">← Обратно към сайта</a>
    </div>
</nav>

<div class="container">
    <h1>Управление на полети</h1>

    <div class="admin-panel">
        <h3 style="margin-top:0;">Добави нов полет</h3>
        
        <div class="ticket-type-selector">
            <label class="radio-label">
                <input type="radio" name="flightType" value="oneway" checked onchange="toggleDateInput()"> 
                Еднопосочен
            </label>
            <label class="radio-label">
                <input type="radio" name="flightType" value="round" onchange="toggleDateInput()"> 
                Двупосочен
            </label>
        </div>

        <div class="form-grid">
            <div>
                <label>От (Град)</label>
                <input type="text" id="flight-from" placeholder="Напр. София">
            </div>
            <div>
                <label>До (Град)</label>
                <input type="text" id="flight-to" placeholder="Напр. Париж">
            </div>
            
            <div>
                <label>Дата на отиване</label>
                <input type="date" id="flight-date">
            </div>
            <div>
                <label>Час на излитане</label>
                <input type="time" id="flight-dep-time">
            </div>

            <div id="return-date-container" style="display: none;">
                <label>Дата на връщане</label>
                <input type="date" id="flight-return-date">
            </div>
            
            <div>
                <label>Час на кацане</label>
                <input type="time" id="flight-arr-time">
            </div>

            <div>
                <label>Цена (€)</label>
                <input type="number" id="flight-price" placeholder="150">
            </div>
            <div>
                <label>Брой места</label>
                <input type="number" id="flight-seats" placeholder="50">
            </div>
        </div>
        <button class="btn-add" onclick="addNewFlight()">Публикувай полет</button>
    </div>

    <div class="flight-list" id="admin-flights-list"></div>

    <h2>Продадени билети</h2>
    <div style="overflow-x:auto;">
        <table class="orders-table">
            <thead>
                <tr>
                    <th>Клиент</th>
                    <th>Контакти</th>
                    <th>Полет</th>
                    <th>Тип</th>
                    <th>Цена</th>
                    <th>Дата на покупка</th>
                    <th>Действие</th>
                </tr>
            </thead>
            <tbody id="orders-list-body">
                </tbody>
        </table>
    </div>

</div>

<script type="module">
    import { auth, db } from './firebase-config.js';
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
    import { collection, addDoc, getDocs, deleteDoc, doc, getDoc, orderBy, query } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            const userDoc = await getDoc(doc(db, "users", user.uid));
            if (userDoc.exists() && userDoc.data().role === "admin") {
                loadFlights();
                loadOrders(); 
            } else {
                alert("Нямате права!");
                window.location.href = "index.html";
            }
        } else {
            window.location.href = "login.html";
        }
    });

    // --- ПОЛЕТИ ---
    window.toggleDateInput = () => {
        const type = document.querySelector('input[name="flightType"]:checked').value;
        const container = document.getElementById('return-date-container');
        if (type === 'round') container.style.display = 'block';
        else {
            container.style.display = 'none';
            document.getElementById('flight-return-date').value = "";
        }
    };

    window.addNewFlight = async () => {
        const type = document.querySelector('input[name="flightType"]:checked').value;
        const from = document.getElementById('flight-from').value;
        const to = document.getElementById('flight-to').value;
        const date = document.getElementById('flight-date').value;
        const depTime = document.getElementById('flight-dep-time').value; 
        const arrTime = document.getElementById('flight-arr-time').value; 
        const price = Number(document.getElementById('flight-price').value);
        const seats = Number(document.getElementById('flight-seats').value);
        
        let returnDate = null;
        if (type === 'round') {
            returnDate = document.getElementById('flight-return-date').value;
            if (!returnDate) { alert("Изберете дата на връщане!"); return; }
        }

        if(!from || !to || !date || !price || !seats || !depTime || !arrTime) {
            alert("Попълнете всички полета!"); return;
        }

        try {
            await addDoc(collection(db, "flights"), {
                type, from, to, date, depTime, arrTime, returnDate, price, seats, createdAt: new Date()
            });
            alert("Полетът е добавен!");
            loadFlights();
        } catch (error) { console.error(error); alert("Грешка."); }
    };

    async function loadFlights() {
        const listContainer = document.getElementById('admin-flights-list');
        listContainer.innerHTML = "<p style='text-align:center'>Зареждане на полети...</p>";
        const querySnapshot = await getDocs(collection(db, "flights"));
        listContainer.innerHTML = "";

        querySnapshot.forEach((flightDoc) => {
            const f = flightDoc.data();
            let badgeHtml = f.type === 'round' 
                ? '<span class="type-badge badge-round">ДВУПОСОЧЕН</span>' 
                : '<span class="type-badge badge-one">ЕДНОПОСОЧЕН</span>';
            let timeText = `🕒 ${f.depTime} ➔ ${f.arrTime}`;

            listContainer.innerHTML += `
                <div class="flight-item">
                    <div class="flight-info">
                        ${badgeHtml}
                        <h3>${f.from} ➔ ${f.to}</h3>
                        <div class="flight-details">
                            Дата: ${f.date} | ${timeText}<br>
                            Цена: ${f.price} € | Места: ${f.seats}
                        </div>
                    </div>
                    <button class="delete-btn" onclick="deleteFlight('${flightDoc.id}')">Изтрий</button>
                </div>
            `;
        });
    }

    window.deleteFlight = async (id) => {
        if(confirm("Изтриване на този полет?")) {
            await deleteDoc(doc(db, "flights", id));
            loadFlights();
        }
    };

    // --- ПОРЪЧКИ (С ФИКСНАТ ЧАС) ---
    async function loadOrders() {
        const tableBody = document.getElementById('orders-list-body');
        tableBody.innerHTML = "<tr><td colspan='7' style='text-align:center'>Зареждане на поръчки...</td></tr>";

        try {
            const ordersSnapshot = await getDocs(collection(db, "orders"));
            
            if (ordersSnapshot.empty) {
                tableBody.innerHTML = "<tr><td colspan='7' style='text-align:center'>Няма продадени билети.</td></tr>";
                return;
            }

            tableBody.innerHTML = ""; 

            // За всяка поръчка...
            for (const orderDoc of ordersSnapshot.docs) {
                const order = orderDoc.data();
                
                // 1. Взимаме инфо за потребителя (Име/Тел)
                let userData = { firstName: "", lastName: "", email: order.userEmail, phone: "-" };
                try {
                    const userSnap = await getDoc(doc(db, "users", order.userId));
                    if (userSnap.exists()) {
                        const u = userSnap.data();
                        userData.firstName = u.firstName || "Без име"; 
                        userData.lastName = u.lastName || "";
                        userData.phone = u.phone || "Няма";
                    } else {
                        userData.firstName = "Изтрит профил";
                    }
                } catch (e) { }

                // 2. Взимаме инфо за полета (ЗА ЧАСОВЕТЕ)
                let flightTimesHtml = "";
                try {
                    // Търсим полета по ID
                    const flightSnap = await getDoc(doc(db, "flights", order.flightId));
                    if (flightSnap.exists()) {
                        const f = flightSnap.data();
                        // Ако имаме часове в полета, ги показваме
                        const dep = f.depTime || "??";
                        const arr = f.arrTime || "??";
                        flightTimesHtml = `<span class="flight-times">🕒 ${dep} ➔ ${arr}</span>`;
                    } else {
                        flightTimesHtml = `<span class="flight-times" style="color:#ff4757;">(Полетът е изтрит)</span>`;
                    }
                } catch (e) {
                    console.log("Error loading flight times", e);
                }

                const typeLabel = order.type === 'round' ? 'Двупосочен' : 'Еднопосочен';

                // Добавяме реда в таблицата
                tableBody.innerHTML += `
                    <tr>
                        <td>
                            <span class="customer-name">${userData.firstName} ${userData.lastName}</span>
                        </td>
                        <td>
                            📧 ${userData.email}<br>
                            📞 ${userData.phone}
                        </td>
                        <td>
                            <strong>${order.flightFrom} ➔ ${order.flightTo}</strong><br>
                            📅 ${order.date}
                            ${flightTimesHtml} </td>
                        <td>${typeLabel}</td>
                        <td style="color:#2ed573; font-weight:bold;">${order.price} €</td>
                        <td>${order.purchaseDate || "-"}</td>
                        <td>
                            <button class="delete-btn" onclick="deleteOrder('${orderDoc.id}')">Анулирай</button>
                        </td>
                    </tr>
                `;
            }

        } catch (error) {
            console.error("Грешка при поръчките:", error);
            tableBody.innerHTML = "<tr><td colspan='7'>Грешка при зареждане.</td></tr>";
        }
    }

    window.deleteOrder = async (orderId) => {
        if(confirm("Анулиране на билет?")) {
            await deleteDoc(doc(db, "orders", orderId));
            loadOrders(); 
        }
    };
</script>
</body>
</html>
