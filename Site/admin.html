<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <title>Админ Панел - SkyTickets</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; padding: 40px; }
        .admin-box { max-width: 500px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        .btn-add { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        .btn-add:hover { background: #0056b3; }
        .back-link { display: block; text-align: center; margin-top: 20px; color: #666; text-decoration: none; }
    </style>
</head>
<body>

    <div class="admin-box">
        <h2>Добави нов полет ✈️</h2>
        <input type="text" id="from" placeholder="От (град)">
        <input type="text" id="to" placeholder="До (град)">
        <input type="date" id="date">
        <input type="number" id="price" placeholder="Цена (лв)">
        <input type="number" id="seats" placeholder="Брой места">
        <button id="btn-save" class="btn-add">Запази полет</button>
        
        <a href="index.html" class="back-link">← Към началната страница</a>
    </div>

    <script type="module">
        import { db } from './firebase-config.js';
        import { collection, addDoc } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

        document.getElementById('btn-save').onclick = async () => {
            // 1. Вземаме стойностите от полетата
            const fromCity = document.getElementById('from').value;
            const toCity = document.getElementById('to').value;
            const flightDate = document.getElementById('date').value;
            const flightPrice = document.getElementById('price').value;
            const flightSeats = document.getElementById('seats').value;

            // Проверка за празни полета
            if(!fromCity || !toCity || !flightDate || !flightPrice || !flightSeats) {
                alert("Моля, попълнете всички полета!");
                return;
            }

            try {
                // 2. Изпращаме данните към Firebase
                await addDoc(collection(db, "flights"), {
                    from: fromCity,
                    to: toCity,
                    date: flightDate,
                    price: Number(flightPrice),
                    seats: Number(flightSeats)
                });

                alert("Полетът е добавен успешно!");
                
                // 3. Изчистваме полетата за следващия запис
                document.querySelectorAll('input').forEach(i => i.value = "");
                
            } catch (error) {
                alert("Грешка при запис: " + error.message);
            }
        };
    </script>
</body>
</html>
