<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | SkyTickets</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.1);
            --border: rgba(255, 255, 255, 0.2);
            --text: #ffffff;
            --accent: #667eea;
            --danger: #ff4757;
        }

        body { 
            font-family: 'Outfit', sans-serif; 
            margin: 0; color: var(--text);
            background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #1a1a2e);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        nav { 
            background: rgba(15, 12, 41, 0.6);
            backdrop-filter: blur(12px);
            height: 80px; padding: 0 8%;
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 1px solid var(--border);
        }
        .logo { font-size: 24px; font-weight: 700; color: white; text-decoration: none; }
        .nav-links a { color: #cbd5e1; text-decoration: none; margin-left: 20px; transition: 0.3s; }
        .nav-links a:hover { color: white; }

        .container { max-width: 900px; margin: 50px auto; padding: 0 20px; }
        
        h1 { text-align: center; margin-bottom: 40px; }

        /* ADMIN FORM */
        .admin-panel {
            background: var(--glass);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            padding: 30px; border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        /* РАДИО БУТОНИ ЗА ТИП БИЛЕТ */
        .ticket-type-selector {
            display: flex; gap: 20px; margin-bottom: 25px;
            padding-bottom: 20px; border-bottom: 1px solid var(--border);
        }
        .radio-label {
            display: flex; align-items: center; cursor: pointer; font-weight: 500;
        }
        .radio-label input { 
            width: 18px; height: 18px; margin-right: 10px; cursor: pointer;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        input { 
            width: 100%; padding: 12px; 
            background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 10px;
            color: white; font-family: inherit; outline: none; box-sizing: border-box;
        }
        input:focus { border-color: var(--accent); }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #cbd5e1; }

        .btn-add {
            background: var(--accent); color: white; border: none; padding: 15px; 
            border-radius: 10px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 20px;
            transition: 0.3s;
        }
        .btn-add:hover { filter: brightness(1.2); }

        /* LIST OF FLIGHTS */
        .flight-list { margin-top: 40px; }
        .flight-item {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            padding: 20px; border-radius: 12px; margin-bottom: 15px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .flight-info h3 { margin: 0 0 5px 0; font-size: 20px; }
        .flight-details { font-size: 14px; color: #cbd5e1; }
        
        .type-badge {
            display: inline-block; padding: 3px 8px; border-radius: 4px; 
            font-size: 11px; font-weight: 700; text-transform: uppercase; margin-bottom: 5px;
        }
        .badge-round { background: #667eea; color: white; }
        .badge-one { background: #a5b4fc; color: #0f0c29; }

        .delete-btn {
            background: rgba(255, 71, 87, 0.2); color: var(--danger); border: 1px solid var(--danger);
            padding: 8px 15px; border-radius: 8px; cursor: pointer; transition: 0.3s;
        }
        .delete-btn:hover { background: var(--danger); color: white; }

    </style>
</head>
<body>

<nav>
    <a href="index.html" class="logo">SkyTickets Admin</a>
    <div class="nav-links">
        <a href="index.html">← Обратно към сайта</a>
    </div>
</nav>

<div class="container">
    <h1>Управление на полети</h1>

    <div class="admin-panel">
        <h3 style="margin-top:0;">Добави нов полет</h3>
        
        <div class="ticket-type-selector">
            <label class="radio-label">
                <input type="radio" name="flightType" value="oneway" checked onchange="toggleDateInput()"> 
                Еднопосочен
            </label>
            <label class="radio-label">
                <input type="radio" name="flightType" value="round" onchange="toggleDateInput()"> 
                Двупосочен (Отиване и Връщане)
            </label>
        </div>

        <div class="form-grid">
            <div>
                <label>От (Град)</label>
                <input type="text" id="flight-from" placeholder="Напр. София">
            </div>
            <div>
                <label>До (Град)</label>
                <input type="text" id="flight-to" placeholder="Напр. Париж">
            </div>
            
            <div>
                <label>Дата на отиване</label>
                <input type="date" id="flight-date">
            </div>

            <div id="return-date-container" style="display: none;">
                <label>Дата на връщане</label>
                <input type="date" id="flight-return-date">
            </div>

            <div>
                <label>Цена (€)</label>
                <input type="number" id="flight-price" placeholder="150">
            </div>
            <div>
                <label>Брой места</label>
                <input type="number" id="flight-seats" placeholder="50">
            </div>
        </div>
        <button class="btn-add" onclick="addNewFlight()">Публикувай полет</button>
    </div>

    <div class="flight-list" id="admin-flights-list">
        </div>
</div>

<script type="module">
    import { auth, db } from './firebase-config.js';
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
    import { collection, addDoc, getDocs, deleteDoc, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

    // 1. ПРОВЕРКА ДАЛИ Е АДМИН
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            const userDoc = await getDoc(doc(db, "users", user.uid));
            if (userDoc.exists() && userDoc.data().role === "admin") {
                loadFlights();
            } else {
                alert("Нямате права на администратор!");
                window.location.href = "index.html";
            }
        } else {
            window.location.href = "login.html";
        }
    });

    // 2. СКРИВАНЕ/ПОКАЗВАНЕ НА ПОЛЕТО ЗА ВРЪЩАНЕ
    window.toggleDateInput = () => {
        const type = document.querySelector('input[name="flightType"]:checked').value;
        const container = document.getElementById('return-date-container');
        
        if (type === 'round') {
            container.style.display = 'block';
        } else {
            container.style.display = 'none';
            document.getElementById('flight-return-date').value = ""; // Изчистваме ако скрием
        }
    };

    // 3. ДОБАВЯНЕ НА ПОЛЕТ
    window.addNewFlight = async () => {
        const type = document.querySelector('input[name="flightType"]:checked').value;
        const from = document.getElementById('flight-from').value;
        const to = document.getElementById('flight-to').value;
        const date = document.getElementById('flight-date').value;
        const price = Number(document.getElementById('flight-price').value);
        const seats = Number(document.getElementById('flight-seats').value);
        
        // Взимаме датата на връщане САМО ако е избран двупосочен
        let returnDate = null;
        if (type === 'round') {
            returnDate = document.getElementById('flight-return-date').value;
            if (!returnDate) {
                alert("Моля, изберете дата на връщане за двупосочен полет!");
                return;
            }
        }

        if(!from || !to || !date || !price || !seats) {
            alert("Моля попълнете всички полета!");
            return;
        }

        try {
            await addDoc(collection(db, "flights"), {
                type: type, // Записваме дали е 'oneway' или 'round'
                from: from,
                to: to,
                date: date,
                returnDate: returnDate, 
                price: price,
                seats: seats,
                createdAt: new Date()
            });
            
            alert("Полетът е добавен успешно!");
            loadFlights();
            
            // Изчистване на формата
            document.getElementById('flight-from').value = "";
            document.getElementById('flight-to').value = "";
            document.getElementById('flight-price').value = "";
            document.getElementById('flight-seats').value = "";
            document.getElementById('flight-date').value = "";
            document.getElementById('flight-return-date').value = "";
            // Връщаме на еднопосочен по подразбиране
            document.querySelector('input[value="oneway"]').checked = true;
            toggleDateInput();

        } catch (error) {
            console.error("Error:", error);
            alert("Грешка при добавяне.");
        }
    };

    // 4. ЗАРЕЖДАНЕ НА СПИСЪКА
    async function loadFlights() {
        const listContainer = document.getElementById('admin-flights-list');
        listContainer.innerHTML = "<p style='text-align:center'>Зареждане...</p>";
        
        const querySnapshot = await getDocs(collection(db, "flights"));
        listContainer.innerHTML = "";

        querySnapshot.forEach((flightDoc) => {
            const flight = flightDoc.data();
            
            // Определяме баджа (етикета)
            let badgeHtml = '';
            let dateText = `📅 Отиване: ${flight.date}`;

            if (flight.type === 'round' || flight.returnDate) {
                badgeHtml = '<span class="type-badge badge-round">ДВУПОСОЧЕН</span>';
                dateText += ` | 🔙 Връщане: ${flight.returnDate}`;
            } else {
                badgeHtml = '<span class="type-badge badge-one">ЕДНОПОСОЧЕН</span>';
            }

            listContainer.innerHTML += `
                <div class="flight-item">
                    <div class="flight-info">
                        ${badgeHtml}
                        <h3>${flight.from} ➔ ${flight.to}</h3>
                        <div class="flight-details">
                            ${dateText}<br>
                            Цена: ${flight.price} €. | Места: ${flight.seats}
                        </div>
                    </div>
                    <button class="delete-btn" onclick="deleteFlight('${flightDoc.id}')">Изтрий</button>
                </div>
            `;
        });
    }

    // 5. ИЗТРИВАНЕ
    window.deleteFlight = async (id) => {
        if(confirm("Изтриване на този полет?")) {
            await deleteDoc(doc(db, "flights", id));
            loadFlights();
        }
    };
</script>

</body>
</html>
