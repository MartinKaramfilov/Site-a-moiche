<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ Панел | SkyTickets</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8fafc; --white: #ffffff; --primary: #1e293b; 
            --accent: #2563eb; --danger: #ef4444; --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        body { font-family: 'Inter', sans-serif; background-color: var(--bg); margin: 0; color: #0f172a; }

        /* НАВИГАЦИЯ (Същата като в index.html) */
        nav { 
            background: var(--white); height: 70px; padding: 0 8%;
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 1px solid var(--border);
        }
        .logo { font-size: 20px; font-weight: 800; color: var(--primary); text-decoration: none; }
        .logo span { color: var(--accent); }
        .nav-links { display: flex; gap: 20px; align-items: center; }
        .nav-links a { text-decoration: none; color: #64748b; font-weight: 600; font-size: 14px; }
        .nav-links a:hover { color: var(--accent); }

        /* ОСНОВЕН КОНТЕЙНЕР */
        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        h1 { font-size: 28px; font-weight: 800; margin-bottom: 20px; }

        /* ФОРМА ЗА ДОБАВЯНЕ */
        .admin-panel { 
            background: var(--white); padding: 30px; border-radius: 16px; 
            box-shadow: var(--shadow); border: 1px solid var(--border);
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
            margin-bottom: 40px;
        }
        .full-width { grid-column: span 2; }
        
        input { 
            padding: 12px; border: 1px solid var(--border); border-radius: 8px; 
            width: 100%; box-sizing: border-box; font-family: inherit;
        }
        button.add-btn { 
            background: var(--primary); color: white; border: none; 
            padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer;
            width: 100%; grid-column: span 2; transition: 0.2s;
        }
        button.add-btn:hover { background: var(--accent); }

        /* СПИСЪК С ПОЛЕТИ */
        .flight-item { 
            background: var(--white); padding: 20px; border-radius: 12px; 
            margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;
            border: 1px solid var(--border);
        }
        .delete-btn { 
            background: #fee2e2; color: var(--danger); border: none; 
            padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600;
        }
        .delete-btn:hover { background: var(--danger); color: white; }
    </style>
</head>
<body>

<nav>
    <a href="index.html" class="logo">Sky<span>Tickets</span></a>
    <div class="nav-links">
        <a href="index.html">Начало</a>
        <a href="aboutus.html">За нас</a>
        <a href="contacts.html">Контакти</a>
        <span style="color: var(--accent); font-weight: 700; border: 1px solid var(--accent); padding: 5px 10px; border-radius: 5px;">ADMIN MODE</span>
    </div>
</nav>

<div class="container">
    <h1>Управление на полети</h1>
    
    <div class="admin-panel">
        <input type="text" id="from" placeholder="От (Град)">
        <input type="text" id="to" placeholder="До (Град)">
        <input type="date" id="date">
        <input type="number" id="price" placeholder="Цена (лв.)">
        <div class="full-width">
            <input type="number" id="seats" placeholder="Брой места (напр. 150)">
        </div>
        <button class="add-btn" onclick="addFlight()">➕ Добави Полет</button>
    </div>

    <h2>Активни полети</h2>
    <div id="admin-flights-list">Зареждане...</div>
</div>

<script type="module">
    import { auth, db } from './firebase-config.js';
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
    import { collection, addDoc, getDocs, doc, deleteDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

    // 1. ЗАЩИТА НА СТРАНИЦАТА
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            const userDoc = await getDoc(doc(db, "users", user.uid));
            if (!userDoc.exists() || userDoc.data().role !== "admin") {
                alert("Нямате администраторски права!");
                window.location.href = "index.html";
            } else {
                loadFlights(); // Само ако е админ, зареждаме данните
            }
        } else {
            window.location.href = "login.html";
        }
    });

    // 2. ДОБАВЯНЕ НА ПОЛЕТ
    window.addFlight = async () => {
        const from = document.getElementById('from').value;
        const to = document.getElementById('to').value;
        const date = document.getElementById('date').value;
        const price = Number(document.getElementById('price').value);
        const seats = Number(document.getElementById('seats').value);

        if (!from || !to || !date || !price || !seats) {
            alert("Моля, попълнете всички полета!");
            return;
        }

        try {
            await addDoc(collection(db, "flights"), {
                from, to, date, price, seats
            });
            alert("Полетът е добавен успешно!");
            
            // Изчистване на формата
            document.getElementById('from').value = "";
            document.getElementById('to').value = "";
            document.getElementById('date').value = "";
            document.getElementById('price').value = "";
            document.getElementById('seats').value = "";
            
            loadFlights();
        } catch (e) {
            alert("Грешка при запис: " + e.message);
        }
    };

    // 3. ЗАРЕЖДАНЕ И ИЗТРИВАНЕ
    async function loadFlights() {
        const list = document.getElementById('admin-flights-list');
        list.innerHTML = "";
        
        const querySnapshot = await getDocs(collection(db, "flights"));
        
        querySnapshot.forEach((docSnap) => {
            const flight = docSnap.data();
            list.innerHTML += `
                <div class="flight-item">
                    <div>
                        <strong>${flight.from} ➔ ${flight.to}</strong><br>
                        <small>${flight.date} | ${flight.price} лв. | Места: ${flight.seats}</small>
                    </div>
                    <button class="delete-btn" onclick="deleteFlight('${docSnap.id}')">Изтрий</button>
                </div>
            `;
        });
    }

    window.deleteFlight = async (id) => {
        if (confirm("Сигурни ли сте, че искате да изтриете този полет?")) {
            await deleteDoc(doc(db, "flights", id));
            loadFlights();
        }
    };
</script>

</body>
</html>
