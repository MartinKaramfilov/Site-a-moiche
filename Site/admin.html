<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ Панел | SkyTickets</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        * {
            box-sizing: border-box;
        }
        :root {
            --glass: rgba(255, 255, 255, 0.1);
            --border: rgba(255, 255, 255, 0.2);
            --text: #ffffff;
            --text-dim: #cbd5e1;
            --accent: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --danger: #ff4757;
        }

        body { 
            font-family: 'Outfit', sans-serif; 
            margin: 0; 
            color: var(--text);
            background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #1a1a2e);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /*STYLES ЗА АЛЕРТИ*/
        div:where(.swal2-container) div:where(.swal2-popup) {
            background: rgba(25, 25, 40, 0.95) !important;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            color: white !important;
            border-radius: 20px !important;
        }
        div:where(.swal2-container) button.swal2-styled.swal2-confirm { 
            background: var(--accent) !important; 
            box-shadow: 0 0 15px rgba(102, 126, 234, 0.4); 
        }
        div:where(.swal2-container) button.swal2-styled.swal2-cancel { 
            background: rgba(255,255,255,0.1) !important; 
        }

        /*НОВАТА РАЗДЕЛЕНА НАВИГАЦИЯ*/
        nav { 
            background: rgba(15, 12, 41, 0.6);
            backdrop-filter: blur(12px);
            height: 80px; 
            padding: 0 5%;
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid var(--border);
            position: sticky; 
            top: 0; 
            z-index: 100;
        }
        
        .nav-left { display: flex; align-items: center; gap: 40px; }
        .logo { font-size: 26px; font-weight: 700; color: white; text-decoration: none; }
        .main-menu { display: flex; gap: 25px; }
        .main-menu a { text-decoration: none; color: var(--text-dim); transition: 0.3s; font-weight: 500; font-size: 15px; }
        .main-menu a:hover { color: white; }

        .nav-right { display: flex; align-items: center; gap: 20px; }
        #user-display { font-size: 14px; }
        
        #btn-logout { 
            background: rgba(255, 71, 87, 0.2); 
            color: #ff4757; 
            border: 1px solid #ff4757; 
            padding: 6px 18px; 
            border-radius: 20px; 
            cursor: pointer; 
            font-family: inherit; 
            font-size: 13px; 
        }
        #btn-logout:hover { background: #ff4757; color: white; }

        /*АДМИН ПАНЕЛ СТИЛОВЕ*/
        .admin-container { 
            max-width: 1200px; 
            margin: 40px auto; 
            padding: 0 20px; 
            display: grid; 
            grid-template-columns: 350px 1fr; 
            gap: 30px; 
        }
        
        .glass-panel { 
            background: var(--glass); 
            backdrop-filter: blur(16px); 
            border: 1px solid var(--border); 
            border-radius: 24px; 
            padding: 30px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); 
        }
        
        h2 { 
            margin-top: 0; 
            font-size: 24px; 
            color: #a5b4fc; 
            border-bottom: 1px solid rgba(255,255,255,0.1); 
            padding-bottom: 15px; 
            margin-bottom: 25px; 
        }

        /* ФОРМА ЗА ДОБАВЯНЕ */
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 5px; text-transform: uppercase; }
        
        input, select { 
            width: 100%; padding: 12px; 
            background: rgba(0,0,0,0.3); border: 1px solid var(--border); 
            border-radius: 10px; color: white; font-family: inherit; 
            font-size: 15px; box-sizing: border-box; outline: none; 
        }
        input:focus, select:focus { border-color: #a5b4fc; }
        option { background: #1a1a2e; color: white; }
        
        .submit-btn { 
            background: var(--accent); color: white; border: none; 
            padding: 15px; border-radius: 10px; font-weight: 700; 
            width: 100%; font-size: 16px; cursor: pointer; 
            margin-top: 10px; transition: 0.3s; 
        }
        .submit-btn:hover { transform: translateY(-2px); filter: brightness(1.2); }

        /* СПИСЪК С ПОЛЕТИ И БИЛЕТИ */
        .flight-item, .order-item { 
            background: rgba(0,0,0,0.2); 
            border: 1px solid var(--border); 
            padding: 15px 20px; 
            border-radius: 12px; 
            margin-bottom: 15px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            transition: 0.3s; 
        }
        
        .flight-item:hover, .order-item:hover { background: rgba(255,255,255,0.05); }
        .f-route { font-size: 18px; font-weight: 700; margin-bottom: 5px; }
        .f-details { font-size: 13px; color: var(--text-dim); }
        
        .del-btn { 
            background: rgba(255, 71, 87, 0.2); 
            color: #ff4757; 
            border: 1px solid #ff4757; 
            padding: 6px 15px; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: 0.3s; 
            font-weight: bold; 
        }
        .del-btn:hover { background: #ff4757; color: white; }

        .right-column {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
@media (max-width: 950px) {
            /* 1. ОПРАВЯМЕ МЕНЮТО */
            nav { 
                flex-direction: column; 
                height: auto; 
                padding: 15px 20px; 
                gap: 15px; 
            }
            .nav-left { flex-direction: column; gap: 15px; width: 100%; }
            .main-menu { flex-wrap: wrap; justify-content: center; gap: 15px; }
            .nav-right { width: 100%; justify-content: center; flex-wrap: wrap; gap: 10px; }

            /* 2. ТУК Е МАГИЯТА ЗА АДМИН ПАНЕЛА */
            .admin-container {
                grid-template-columns: 1fr; /* Правим го на точно 1 колона! */
                margin: 20px auto;
                padding: 0 10px;
            }

            /* 3. Оправяме картите с полети да не излизат от екрана */
            .flight-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
            .flight-actions {
                width: 100%;
                display: flex;
                gap: 10px;
            }
            .edit-btn, .delete-btn {
                flex: 1; /* Разпъва бутоните по равно */
                text-align: center;
            }
        }
    </style>
</head>
<body>

<nav>
    <div class="nav-left">
        <a href="index.html" class="logo">SkyTickets</a>
        <div class="main-menu">
            <a href="index.html">Търсене</a>
            <a href="my-tickets.html">Моите билети</a>
            <a href="aboutus.html">За нас</a>
            <a href="contacts.html">Контакти</a>
        </div>
    </div>

    <div class="nav-right">
        <a href="admin.html" id="admin-btn" style="color: white; font-weight: 700; text-decoration: none;">Админ</a>
        <span id="user-display"></span>
        <button id="btn-logout" style="display: none;">Изход</button>
    </div>
</nav>

<div class="admin-container">
    
    <div class="glass-panel" style="align-self: start;">
        <h2>✈️ Добави полет</h2>
        
        <div class="form-group">
            <label>Тип полет</label>
            <select id="f-type" onchange="toggleReturn()">
                <option value="oneway">Еднопосочен</option>
                <option value="round">Двупосочен</option>
            </select>
        </div>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div class="form-group">
                <label>От (Град)</label>
                <input type="text" id="f-from" placeholder="Напр. София" oninput="this.value = this.value.replace(/[^a-zA-Zа-яА-Я\s]/g, '')">
            </div>
            <div class="form-group">
                <label>До (Град)</label>
                <input type="text" id="f-to" placeholder="Напр. Лондон" oninput="this.value = this.value.replace(/[^a-zA-Zа-яА-Я\s]/g, '')">
            </div>
        </div>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div class="form-group">
                <label>Дата на тръгване</label>
                <input type="date" id="f-date" style="color-scheme: dark;">
            </div>
            <div class="form-group">
                <label>Час тръгване</label>
                <input type="time" id="f-dep-time" style="color-scheme: dark;">
            </div>
        </div>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div class="form-group">
                <label>Дата на връщане</label>
                <input type="date" id="f-return-date" style="color-scheme: dark;" disabled>
            </div>
            <div class="form-group">
                <label>Час пристигане</label>
                <input type="time" id="f-arr-time" style="color-scheme: dark;">
            </div>
        </div>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div class="form-group">
                <label>Цена (€)</label>
                <input type="number" id="f-price" placeholder="0">
            </div>
            <div class="form-group">
                <label>Места</label>
                <input type="number" id="f-seats" placeholder="100">
            </div>
        </div>
        <div class="form-group" style="margin-top: 10px;">
            <label>Снимка на града (URL Линк)</label>
            <input type="text" id="f-img" placeholder="https://example.com/paris.jpg">
        </div>
        
        <button class="submit-btn" onclick="addFlight()">Създай полет</button>
    </div>

    <div class="right-column">
        
        <div class="glass-panel">
            <h2>📋 Активни полети</h2>
            <div id="admin-flights-list">Зареждане...</div>
        </div>

        <div class="glass-panel">
            <h2>🎫 Продадени билети</h2>
            <div id="admin-orders-list">Зареждане...</div>
        </div>

    </div>
    <div class="glass-panel" style="margin-top: 30px; grid-column: 1 / -1;">
        <h2>✉️ Съобщения от клиенти</h2>
        <div id="messages-list">
            <p style="text-align:center; opacity:0.7;">Зареждане на съобщения...</p>
        </div>
    </div>
</div>
<footer><p style="text-align: center; color: var(--text-muted); margin-top: 50px;">&copy; 2026 SkyTickets.</p></footer>

<script type="module">
    import { auth, db } from './firebase-config.js';
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
    // ДОБАВИХМЕ updateDoc ТУК: 
    import { collection, addDoc, getDocs, deleteDoc, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

    // --- UI HELPER ЗА КРАСИВИ АЛЕРТИ ---
    const UI = {
        success: (title, msg) => Swal.fire({ title: title, text: msg, icon: 'success', confirmButtonText: 'Ок' }),
        error: (title, msg) => Swal.fire({ title: title, text: msg, icon: 'error', confirmButtonText: 'Разбрах' }),
        warning: (title, msg) => Swal.fire({ title: title, text: msg, icon: 'warning', confirmButtonText: 'Ок' }),
        confirm: (title, text) => Swal.fire({ 
            title: title, 
            text: text, 
            icon: 'warning', 
            showCancelButton: true, 
            confirmButtonText: 'Да', 
            cancelButtonText: 'Отказ', 
            confirmButtonColor: '#ff4757' 
        })
    };

    // Защита на страницата (само за админи)
    onAuthStateChanged(auth, async (user) => {
        const d = document.getElementById('user-display');
        const out = document.getElementById('btn-logout');
       
        if (user) {
            d.innerHTML = `<a href="profile.html" style="color:#a5b4fc; text-decoration:none; font-weight:bold;">👤 ${user.email.split('@')[0]}</a>`;
            out.style.display = "block";

            try {
                const u = await getDoc(doc(db, "users", user.uid));
                if (!u.exists() || u.data().role !== "admin") {
                    window.location.href = "index.html"; 
                } else {
                    //Админът е влязъл
                    await cleanUpPastFlights(); 
                    loadAdminFlights();   
                    loadAdminOrders();    
                    loadMessages();       
                }
            } catch(e) { window.location.href = "index.html"; }
        } else {
            window.location.href = "login.html";
        }
    });

    document.getElementById('btn-logout').onclick = () => signOut(auth).then(() => location.reload());

    window.toggleReturn = () => {
        const type = document.getElementById('f-type').value;
        const returnDate = document.getElementById('f-return-date');
        if (type === 'round') { returnDate.disabled = false; } else { returnDate.disabled = true; returnDate.value = ""; }
    };

  // --- ДОБАВЯНЕ НА ПОЛЕТ ---
    window.addFlight = async () => {
        const type = document.getElementById('f-type').value;
        const from = document.getElementById('f-from').value.trim();
        const to = document.getElementById('f-to').value.trim();
        const date = document.getElementById('f-date').value;
        const returnDate = document.getElementById('f-return-date').value;
        const depTime = document.getElementById('f-dep-time').value;
        const arrTime = document.getElementById('f-arr-time').value;
        const price = Number(document.getElementById('f-price').value);
        const seats = Number(document.getElementById('f-seats').value);
        
        // ВЗИМАМЕ ЛИНКА КЪМ СНИМКАТА
        const imgUrl = document.getElementById('f-img').value.trim();
        
        // 1. ПРОВЕРКА ЗА ПРАЗНИ ПОЛЕТА
        if (!from || !to || !date || !depTime || !arrTime || price <= 0 || seats <= 0) {
            UI.warning("Внимание", "Моля, попълнете всички задължителни полета!");
            return;
        }
        if (type === 'round' && !returnDate) {
            UI.warning("Внимание", "Въведете дата на връщане!");
            return;
        }

        // --- НОВИ ПРОВЕРКИ ЗА ДАТИ ---
        // 2. Проверка дали датата и часът не са в миналото
        const selectedDateTime = new Date(`${date}T${depTime}`);
        const currentDateTime = new Date();

        if (selectedDateTime < currentDateTime) {
            UI.warning("Невалидна дата/час!", "Не можете да добавите полет в миналото. Моля, изберете бъдеща дата и час.");
            return; // 🛑 Спира функцията!
        }

        // 3. Проверка за двупосочен полет (Връщането да не е преди тръгването)
        if (type === 'round' && returnDate) {
            const dReturn = new Date(returnDate);
            const dDepart = new Date(date);

            if (dReturn < dDepart) {
                UI.warning("Нелогични дати!", "Датата на връщане не може да е преди датата на заминаване.");
                return; // 🛑 Спира функцията!
            }
        }
        // --- КРАЙ НА НОВИТЕ ПРОВЕРКИ ---

        try {
            // ЗАПАЗВАМЕ И СНИМКАТА (img) В БАЗАТА
            await addDoc(collection(db, "flights"), { 
                type, from, to, date, returnDate, depTime, arrTime, price, seats, 
                img: imgUrl // Тук се запазва линкът
            });
            
            UI.success("Готово!", "Полетът беше добавен успешно.");
            
            // Изчистване на формата
            document.getElementById('f-from').value = ''; document.getElementById('f-to').value = '';
            document.getElementById('f-date').value = ''; document.getElementById('f-return-date').value = '';
            document.getElementById('f-dep-time').value = ''; document.getElementById('f-arr-time').value = '';
            document.getElementById('f-price').value = ''; document.getElementById('f-seats').value = '';
            document.getElementById('f-img').value = ''; // Чистим и полето за снимка
            
            loadAdminFlights(); 
        } catch (error) { 
            console.error(error);
            UI.error("Грешка", "Възникна проблем."); 
        }
    };

    // --- ЗАРЕЖДАНЕ НА ПОЛЕТИТЕ ---
    async function loadAdminFlights() {
        const list = document.getElementById('admin-flights-list');
        list.innerHTML = "Зареждане...";
        try {
            const querySnapshot = await getDocs(collection(db, "flights"));
            list.innerHTML = "";
            if (querySnapshot.empty) { list.innerHTML = "<p style='color:var(--text-dim);'>Няма активни полети.</p>"; return; }

            querySnapshot.forEach((doc) => {
                const f = doc.data();
                const returnText = f.type === 'round' ? ` | 🔙 ${f.returnDate}` : '';
                
                list.innerHTML += `
                    <div class="flight-item">
                        <div>
                            <div class="f-route">${f.from.toUpperCase()} ✈ ${f.to.toUpperCase()}</div>
                            <div class="f-details">📅 ${f.date} ${returnText} &nbsp;|&nbsp; ⏰ ${f.depTime} - ${f.arrTime} &nbsp;|&nbsp; 💺 ${f.seats} места &nbsp;|&nbsp; 💶 ${f.price}€</div>
                        </div>
                        <button class="del-btn" onclick="deleteFlight('${doc.id}')">Изтрий</button>
                        
                    </div>
                `;
            });
        } catch (e) { list.innerHTML = "Грешка при зареждане."; }
    }
    // --- 2. МЪРЗЕЛИВИЯТ ЧИСТАЧ НА МИНАЛИ ПОЛЕТИ (С ЛОГОВЕ) ---
    async function cleanUpPastFlights() {
        console.log("Проверка");
        try {
            const flightsSnap = await getDocs(collection(db, "flights"));
            const now = new Date(); 
            let deletedCount = 0; 

            for (const flightDoc of flightsSnap.docs) {
                const fData = flightDoc.data();
                
                if (fData.date && fData.depTime) {
                    // Опитваме се да сглобим датата
                    const departureDate = new Date(`${fData.date}T${fData.depTime}`);
                    
                    // ШП Показва ни как компютърът вижда датата
                    console.log(`Проверка на полет до ${fData.to}: Излита на ->`, departureDate);

                    // Проверяваме дали датата е валидна и дали е в миналото
                    if (!isNaN(departureDate) && departureDate < now) {
                        console.log(` ИЗТРИВАНЕ НА ПОЛЕТ: ${fData.to} (Беше на ${fData.date})`);
                        await deleteDoc(doc(db, "flights", flightDoc.id));
                        deletedCount++;
                    }
                }
            }

            if (deletedCount > 0) {
                console.log(`Изтрити са ${deletedCount} стари полета.`);
            } else {
                console.log("Нямаше полети за триене (всички са в бъдещето).");
            }
        } catch (error) {
            console.error(" Грешка при почистване:", error);
        }
    }

    // --- ИЗТРИВАНЕ НА ПОЛЕТ ---
    window.deleteFlight = async (id) => {
        const result = await UI.confirm("Сигурни ли сте?", "Този полет ще бъде изтрит завинаги!");
        if (result.isConfirmed) {
            try {
                await deleteDoc(doc(db, "flights", id));
                UI.success("Изтрит!", "Полетът беше успешно премахнат.");
                loadAdminFlights();
            } catch (e) { UI.error("Грешка", "Полетът не можа да бъде изтрит."); }
        }
    };

    // --- ЗАРЕЖДАНЕ НА ПРОДАДЕНИТЕ БИЛЕТИ ---
    async function loadAdminOrders() {
        const list = document.getElementById('admin-orders-list');
        list.innerHTML = "Зареждане...";
        
        try {
            const querySnapshot = await getDocs(collection(db, "orders"));
            list.innerHTML = "";
            
            if (querySnapshot.empty) { 
                list.innerHTML = "<p style='color:var(--text-dim);'>Все още няма продадени билети.</p>"; 
                return; 
            }

            querySnapshot.forEach((doc) => {
                const order = doc.data();
                const orderId = doc.id;
                
                list.innerHTML += `
                    <div class="order-item">
                        <div>
                            <div class="f-route">${order.flightFrom} ➔ ${order.flightTo}</div>
                            <div class="f-details">
                                👤 Клиент: <strong style="color:white;">${order.userEmail}</strong> <br>
                                📅 Полет: ${order.date} &nbsp;|&nbsp; 
                                🏷️ Тарифа: ${order.tariff || 'Basic'} &nbsp;|&nbsp; 
                                💶 Платено: <strong style="color:#2ed573;">${order.price}€</strong>
                            </div>
                        </div>
                        <button class="del-btn" onclick="cancelOrder('${orderId}', '${order.flightId}')">Анулирай</button>
                    </div>
                `;
            });
        } catch (e) { list.innerHTML = "Грешка при зареждане."; }
    }

   // --- АНУЛИРАНЕ НА ПРОДАДЕН БИЛЕТ (С ОБОСНОВКА) ---
    window.cancelOrder = async (orderId, flightId) => {
        
        // 1. Изкарваме прозорец, в който админът ЗАДЪЛЖИТЕЛНО пише причина
        const { value: cancelReason } = await Swal.fire({
            title: 'Анулиране на билет',
            input: 'textarea',
            inputLabel: 'Причина за анулиране (ще се покаже на клиента):',
            inputPlaceholder: 'Напр. Полетът е отменен поради лошо време...',
            showCancelButton: true,
            confirmButtonText: 'Анулирай билета',
            cancelButtonText: 'Отказ',
            background: 'rgba(25, 25, 40, 0.95)',
            color: 'white',
            inputValidator: (value) => {
                // Не му даваме да продължи, ако не е написал нищо
                if (!value.trim()) {
                    return 'Моля, напишете обосновка защо анулирате билета!';
                }
            }
        });

        // 2. Ако админът е написал причина и е цъкнал "Анулирай"
        if (cancelReason) {
            try {
                // Връщаме 1 място обратно в полета (както си беше и досега)
                const flightRef = doc(db, "flights", flightId);
                const flightSnap = await getDoc(flightRef);
                
                if (flightSnap.exists()) {
                    const currentSeats = flightSnap.data().seats;
                    await updateDoc(flightRef, { seats: currentSeats + 1 });
                }

                // 🛑 ВАЖНО: Вече НЕ трием поръчката с deleteDoc!
                // Вместо това я обновяваме, слагаме статус 'cancelled' и добавяме причината.
                await updateDoc(doc(db, "orders", orderId), {
                    status: 'cancelled',
                    cancelReason: cancelReason
                });

                UI.success("Готово!", "Билетът е анулиран и обосновката е запазена.");
                
                // Презареждаме и двата списъка
                loadAdminOrders();
                loadAdminFlights();
            } catch (error) {
                console.error(error);
                UI.error("Грешка", "Възникна проблем при анулирането.");
            }
        }
    };
    // ФУНКЦИЯ ЗА ЗАРЕЖДАНЕ НА СЪОБЩЕНИЯТА
    async function loadMessages() {
        const msgsList = document.getElementById('messages-list');
        
        try {
            const querySnapshot = await getDocs(collection(db, "messages"));
            
            if (querySnapshot.empty) {
                msgsList.innerHTML = "<div style='text-align:center; padding:20px; color:#cbd5e1;'>Няма нови съобщения.</div>";
                return;
            }

            msgsList.innerHTML = ""; // Изчистваме "Зареждане..."
            
            querySnapshot.forEach((docSnap) => {
                const msg = docSnap.data();
                const msgId = docSnap.id;
                
                // Проверяваме имената на полетата (ако си ги кръстил различно, смени ги)
                const senderName = msg.name || 'Анонимен';
                const senderEmail = msg.email || 'Няма имейл';
                const messageText = msg.text || msg.message || 'Празно съобщение';

                msgsList.innerHTML += `
                    <div style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 15px; border-radius: 12px; margin-bottom: 15px; position: relative;">
                        <div style="margin-bottom: 10px;">
                            <strong style="color: white; font-size: 18px;">${senderName}</strong> 
                            <span style="color: #a5b4fc; margin-left: 10px; font-size: 14px;">✉️ ${senderEmail}</span>
                        </div>
                        <div style="background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px; color: #cbd5e1; font-size: 15px; line-height: 1.5;">
                            ${messageText}
                        </div>
                        <div style="text-align: right; margin-top: 10px;">
                            
                            <button onclick="replyMessage('${senderEmail}')" style="background: rgba(102, 126, 234, 0.2); color: #a5b4fc; border: 1px solid #a5b4fc; padding: 6px 15px; border-radius: 15px; cursor: pointer; margin-right: 10px; transition: 0.3s; display: inline-block;">
                                Отговори
                            </button>

                            <button onclick="deleteMessage('${msgId}')" style="background: rgba(255, 71, 87, 0.15); color: #ff4757; border: 1px solid #ff4757; padding: 6px 15px; border-radius: 15px; cursor: pointer; transition: 0.3s; display: inline-block;">
                                Изтрий
                            </button>

                        </div>
                    </div>
                `;
            });
        } catch (error) {
            console.error("Грешка при зареждане на съобщенията:", error);
            msgsList.innerHTML = "<div style='text-align:center; color:#ff4757;'>Възникна грешка при зареждането.</div>";
        }
    }

   // ФУНКЦИЯ ЗА ИЗТРИВАНЕ НА СЪОБЩЕНИЕ (С КРАСИВИ АЛЪРТИ)
    window.deleteMessage = async (id) => {
        // 1. Питаме за потвърждение с красив прозорец
        const result = await Swal.fire({
            title: 'Сигурни ли сте?',
            text: "Искате да изтриете това съобщение? Действието не може да бъде върнато.",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonText: 'Да, изтрий!',
            cancelButtonText: 'Отказ',
            background: 'rgba(25, 25, 40, 0.95)',
            color: 'white'
        });

        // 2. Ако админът е цъкнал "Да, изтрий!"
        if (result.isConfirmed) {
            try {
                await deleteDoc(doc(db, "messages", id)); // Трием от базата
                
                // Показваме съобщение за успех
                Swal.fire({
                    title: 'Изтрито!',
                    text: 'Съобщението беше премахнато успешно.',
                    icon: 'success',
                    background: 'rgba(25, 25, 40, 0.95)',
                    color: 'white',
                    confirmButtonText: 'Супер'
                });

                loadMessages(); // Презареждаме списъка автоматично
            } catch (e) {
                console.error("Грешка при изтриване:", e);
                // Показваме съобщение за грешка
                Swal.fire({
                    title: 'Грешка!',
                    text: 'Възникна проблем при изтриването.',
                    icon: 'error',
                    background: 'rgba(25, 25, 40, 0.95)',
                    color: 'white',
                    confirmButtonText: 'Ок'
                });
            }
        }
    };
    
    // ФУНКЦИЯ ЗА ОТГОВОР НА СЪОБЩЕНИЕ
    window.replyMessage = (email) => {
        // Проверяваме дали изобщо има имейл
        if (!email || email === 'Няма имейл' || email === 'undefined') {
            Swal.fire({
                title: 'Грешка!', 
                text: 'Този потребител не е оставил валиден имейл адрес.', 
                icon: 'error',
                background: 'rgba(25, 25, 40, 0.95)', color: 'white'
            });
            return;
        }

        // Показваме прозорец с избор
        Swal.fire({
            title: 'Отговор до клиент',
            html: `Имейл адрес:<br><strong style="color:#a5b4fc; font-size:18px;">${email}</strong>`,
            icon: 'info',
            showCancelButton: true,
            confirmButtonText: 'Отвори Gmail',
            cancelButtonText: 'Затвори',
            background: 'rgba(25, 25, 40, 0.95)',
            color: 'white'
        }).then((result) => {
            if (result.isConfirmed) {
                // Отваря директно браузърния Gmail с попълнен получател и тема!
                window.open(`https://mail.google.com/mail/?view=cm&fs=1&to=${email}&su=Отговор от SkyTickets`, '_blank');
            }
        });
    };
</script>
