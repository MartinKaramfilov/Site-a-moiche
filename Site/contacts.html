<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакти | SkyTickets</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        * {
            box-sizing: border-box;
        }
        :root {
            --glass: rgba(255, 255, 255, 0.1);
            --border: rgba(255, 255, 255, 0.2);
            --text: #ffffff;
            --text-dim: #cbd5e1;
            --accent: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        body { 
            font-family: 'Outfit', sans-serif; 
            margin: 0; color: var(--text);
            background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #1a1a2e);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /*STYLE ЗА АЛЕРТИ*/
        div:where(.swal2-container) div:where(.swal2-popup) {
            background: rgba(25, 25, 40, 0.95) !important;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            color: white !important;
            border-radius: 20px !important;
        }
        div:where(.swal2-container) button.swal2-styled.swal2-confirm {
            background: var(--accent) !important;
            box-shadow: 0 0 15px rgba(102, 126, 234, 0.4);
        }

        /* --- НОВАТА РАЗДЕЛЕНА НАВИГАЦИЯ --- */
        nav { 
            background: rgba(15, 12, 41, 0.6);
            backdrop-filter: blur(12px);
            height: 80px; padding: 0 5%;
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 100;
        }

        /* ЛЯВА ЧАСТ */
        .nav-left { display: flex; align-items: center; gap: 40px; }
        /* Нови стилове за логото */
.logo-container {
    display: flex;
    align-items: center; /* Центрира логото и текста вертикално */
    gap: 10px; /* Добавя разстояние между логото и текста */
    text-decoration: none; /* Премахва долната черта от контейнера */
}

.logo-img {
    height: 35px; /* Регулира височината на логото. Можеш да я промениш по твой вкус */
    width: auto; /* Запазва съотношението на страните на изображението */
}

.logo-text {
    font-size: 24px;
    font-weight: 700;
    color: white;
    letter-spacing: -1px;
    /* Наследяваме стиловете на старата .logo класа, за да запазим вида на текста */
}
        .main-menu { display: flex; gap: 25px; }
        .main-menu a { text-decoration: none; color: var(--text-dim); transition: 0.3s; font-weight: 500; font-size: 15px; }
        .main-menu a:hover { color: white; }

        /* ДЯСНА ЧАСТ */
        .nav-right { display: flex; align-items: center; gap: 20px; }
        #user-display { font-size: 14px; }
        #btn-logout {
            background: rgba(255, 71, 87, 0.2); color: #ff4757; 
            border: 1px solid #ff4757; padding: 6px 18px; 
            border-radius: 20px; cursor: pointer; font-family: inherit; font-size: 13px;
        }
        #btn-logout:hover { background: #ff4757; color: white; }

        /* КОНТЕЙНЕР */
        .container { 
            max-width: 900px; margin: 60px auto; padding: 0 20px; 
            display: grid; grid-template-columns: 1fr 1fr; gap: 40px;
        }

        /* ИНФОРМАЦИЯ */
        .info-box { padding: 20px; }
        
        .info-box h2 { 
            font-size: 36px; margin-top: 0; 
            background: linear-gradient(to right, #ffffff, #a5b4fc);
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent; color: transparent; 
        }

        .info-box p { color: var(--text-dim); line-height: 1.6; font-size: 16px; }
        .info-item { margin-top: 25px; display: flex; align-items: center; gap: 15px; font-size: 18px; color: white; }

        /* ФОРМА (GLASS STYLE)*/
        .contact-form { 
            background: var(--glass);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            padding: 40px; border-radius: 20px; 
            border: 1px solid var(--border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        input, textarea { 
            width: 100%; padding: 15px; margin-bottom: 20px; 
            background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 12px;
            color: white; font-family: inherit; outline: none; box-sizing: border-box;
            font-size: 16px; transition: 0.3s;
        }
        input:focus, textarea:focus { border-color: #a5b4fc; background: rgba(0,0,0,0.5); }

        /*БУТОН ЗА ИЗПРАЩАНЕ*/
        .send-btn { 
            background: var(--accent); color: white; border: none; 
            padding: 15px; border-radius: 12px; font-weight: 700; cursor: pointer; 
            width: 100%; transition: 0.3s; font-size: 16px;
            box-shadow: 0 4px 15px rgba(118, 75, 162, 0.4);
        }
        .send-btn:hover { transform: translateY(-2px); filter: brightness(1.2); }

      @media (max-width: 950px) {
            /* 1. ОПРАВЯМЕ МЕНЮТО */
            nav { 
                flex-direction: column !important; 
                height: auto !important; 
                padding: 15px !important; 
                gap: 15px !important; 
            }
            .nav-left { flex-direction: column !important; gap: 15px !important; width: 100% !important; }
            .main-menu { flex-wrap: wrap !important; justify-content: center !important; gap: 15px !important; }
            .nav-right { width: 100% !important; justify-content: center !important; flex-wrap: wrap !important; gap: 10px !important; }

            /* 2. ПОДРЕЖДАМЕ КУТИИТЕ ЕДНА ПОД ДРУГА */
            .container {
                display: flex !important;
                flex-direction: column !important; /* Магията, която ги слага вертикално */
                padding: 15px !important;
                width: 100% !important;
                box-sizing: border-box !important;
                gap: 30px !important; /* Разстояние между инфото и формата */
            }

            /* 3. РАЗПЪВАМЕ ГИ НА 100% ШИРИНА */
            .info-box, 
            .contact-form {
                width: 100% !important;
                max-width: 100% !important;
                margin: 0 !important; /* Махаме излишни отстояния */
                box-sizing: border-box !important;
            }
        }
    </style>
</head>
<body>

<nav>
    <div class="nav-left">
        <a href="index.html" class="logo-container">
    <img src="/images/logo.png" alt="SkyTickets" class="logo-img">
    <span class="logo-text">SkyTickets</span>
        <div class="main-menu">
            <a href="index.html">Търсене</a>
            <a href="my-tickets.html">Моите билети</a>
            <a href="aboutus.html">За нас</a>
            <a href="contacts.html" style="color:white; font-weight:700;">Контакти</a>
        </div>
    </div>

    <div class="nav-right">
        <a href="admin.html" id="admin-btn" style="display: none; color: #a5b4fc; text-decoration: none; font-weight: 500;">Админ</a>
        <span id="user-display"></span>
        <button id="btn-logout" style="display: none;">Изход</button>
    </div>
</nav>

<div class="container">
    <div class="info-box">
        <h2>Свържете се с нас</h2>
        <p>Имате въпроси или проблеми с резервацията? <br>Нашият екип е на разположение, за да помогне.</p>
        
        <div style="margin-top: 40px;">
            <div class="info-item">📍 &nbsp; Варна, България</div>
            <div class="info-item">📞 &nbsp; +359 888 123 456</div>
            <div class="info-item">✉️ &nbsp; support@skytickets.bg</div>
        </div>
    </div>

    <div class="contact-form">
<input type="text" id="msg-name" placeholder="Вашето име" oninput="this.value = this.value.replace(/[^a-zA-Zа-яА-Я\s]/g, '')">
        <input type="email" id="msg-email" placeholder="Вашият имейл">
        <textarea id="msg-text" rows="5" placeholder="Как можем да помогнем?"></textarea>
        <button class="send-btn" onclick="sendMessage()">Изпрати съобщение</button>
    </div>
</div>
    
<script type="module">
    import { auth, db } from './firebase-config.js';
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
    import { collection, addDoc, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

    const UI = {
        success: (title, msg) => Swal.fire({ title: title, text: msg, icon: 'success', confirmButtonText: 'Супер' }),
        error: (title, msg) => Swal.fire({ title: title, text: msg, icon: 'error', confirmButtonText: 'Ок' }),
        warning: (title, msg) => Swal.fire({ title: title, text: msg, icon: 'warning', confirmButtonText: 'Разбрах' })
    };

    window.sendMessage = async () => {
        const name = document.getElementById('msg-name').value;
        const email = document.getElementById('msg-email').value;
        const text = document.getElementById('msg-text').value;

        if (name.trim() === "" || email.trim() === "" || text.trim() === "") {
            UI.warning("Внимание", "Моля, попълнете всички полета!");
            return;
        }

        try {
            await addDoc(collection(db, "messages"), {
                name: name, email: email, message: text, timestamp: new Date().toLocaleString()
            });

            UI.success("Готово!", "Благодарим ви! Съобщението е изпратено успешно.");
            document.getElementById('msg-name').value = "";
            document.getElementById('msg-email').value = "";
            document.getElementById('msg-text').value = "";

        } catch (error) {
            console.error("Грешка:", error);
            UI.error("Грешка!", "Възникна проблем при изпращането.");
        }
    };

    onAuthStateChanged(auth, async (user) => {
        const d = document.getElementById('user-display');
        const out = document.getElementById('btn-logout');
        const adm = document.getElementById('admin-btn');

        if (user) {
            d.innerHTML = `<a href="profile.html" style="color:#a5b4fc; text-decoration:none; font-weight:bold;">👤 ${user.email.split('@')[0]}</a>`;
            out.style.display = "block";
            
            try { 
                const u = await getDoc(doc(db, "users", user.uid)); 
                if (u.exists() && u.data().role === "admin") adm.style.display = "inline-block"; 
            } catch(e) {}

        } else {
            d.innerHTML = '<a href="login.html" style="color:#a5b4fc; text-decoration:none;">Вход</a>';
            out.style.display = "none";
            adm.style.display = "none";
        }
    });

    document.getElementById('btn-logout').onclick = () => signOut(auth).then(() => location.reload());
</script>

</body>
</html>
