<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моите билети | SkyTickets</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.1);
            --border: rgba(255, 255, 255, 0.2);
            --text: #ffffff;
            --text-dim: #cbd5e1;
            --accent: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --danger: #ff4757;
        }

        body { 
            font-family: 'Outfit', sans-serif; 
            margin: 0; color: var(--text);
            background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #1a1a2e);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- НОВАТА РАЗДЕЛЕНА НАВИГАЦИЯ --- */
        nav { 
            background: rgba(15, 12, 41, 0.6);
            backdrop-filter: blur(12px);
            height: 80px; padding: 0 5%;
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 100;
        }

        /* ЛЯВА ЧАСТ */
        .nav-left { display: flex; align-items: center; gap: 40px; }
        .logo { font-size: 26px; font-weight: 700; color: white; text-decoration: none; }
        .main-menu { display: flex; gap: 25px; }
        .main-menu a { text-decoration: none; color: var(--text-dim); transition: 0.3s; font-weight: 500; font-size: 15px; }
        .main-menu a:hover { color: white; }

        /* ДЯСНА ЧАСТ */
        .nav-right { display: flex; align-items: center; gap: 20px; }
        #user-display { font-size: 14px; }
        #btn-logout {
            background: rgba(255, 71, 87, 0.2); color: #ff4757; 
            border: 1px solid #ff4757; padding: 6px 18px; 
            border-radius: 20px; cursor: pointer; font-family: inherit; font-size: 13px;
        }
        #btn-logout:hover { background: #ff4757; color: white; }

        /* SWEETALERT STYLES */
        div:where(.swal2-container) div:where(.swal2-popup) {
            background: rgba(25, 25, 40, 0.95) !important;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            color: white !important;
            border-radius: 20px !important;
        }
        div:where(.swal2-container) button.swal2-styled.swal2-confirm { background: #ff4757 !important; }
        div:where(.swal2-container) button.swal2-styled.swal2-cancel { background: rgba(255,255,255,0.1) !important; }

        /* КОНТЕЙНЕР */
        .container { max-width: 900px; margin: 60px auto; padding: 0 20px; }
        h1 { text-align: center; margin-bottom: 40px; text-shadow: 0 0 20px rgba(165, 180, 252, 0.5); }

        /* БИЛЕТИ */
        .ticket-card {
            background: var(--glass); backdrop-filter: blur(16px);
            border: 1px solid var(--border); border-radius: 24px;
            padding: 0; margin-bottom: 25px;
            display: flex; overflow: hidden; position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); transition: 0.3s;
        }
        .ticket-card:hover { transform: translateY(-5px); }

        .ticket-info { padding: 30px; flex: 1; border-right: 2px dashed rgba(255,255,255,0.2); position: relative; }
        .ticket-info::before, .ticket-info::after { 
            content: ''; position: absolute; right: -10px; width: 20px; height: 20px; 
            background: #1a1a2e; border-radius: 50%; 
        }
        .ticket-info::before { top: -10px; } 
        .ticket-info::after { bottom: -10px; }

        .route { font-size: 24px; font-weight: 700; margin-bottom: 10px; }
        .flight-time { font-size: 28px; font-weight: 700; color: #a5b4fc; margin-bottom: 5px; }
        .dates { font-size: 14px; color: var(--text-dim); margin-bottom: 20px; }
        .badge { display: inline-block; padding: 5px 10px; border-radius: 6px; font-size: 12px; font-weight: 700; text-transform: uppercase; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); }

        .ticket-action { 
            width: 220px; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; 
            background: rgba(0,0,0,0.2); padding: 20px; 
        }
        .price { font-size: 28px; font-weight: 700; margin-bottom: 15px; }
        .qr-box { background: white; padding: 10px; border-radius: 8px; margin-bottom: 20px; }
        
        .cancel-btn { 
            background: rgba(255, 71, 87, 0.15); color: #ff4757; 
            border: 1px solid #ff4757; padding: 8px 20px; 
            border-radius: 20px; cursor: pointer; transition: 0.3s; 
            font-weight: 600; font-size: 14px; 
        }
        .cancel-btn:hover { background: #ff4757; color: white; }

        @media (max-width: 700px) {
            .ticket-card { flex-direction: column; }
            .ticket-info { border-right: none; border-bottom: 2px dashed rgba(255,255,255,0.2); }
            .ticket-action { width: 100%; padding: 30px; box-sizing: border-box; }
            .nav-left { gap: 20px; } .main-menu { gap: 15px; font-size: 14px; }
        }
    </style>
</head>
<body>

<nav>
    <div class="nav-left">
        <a href="index.html" class="logo">SkyTickets</a>
        <div class="main-menu">
            <a href="index.html">Търсене</a>
            <a href="my-tickets.html" style="color:white; font-weight:700;">Моите билети</a>
            <a href="aboutus.html">За нас</a>
            <a href="contacts.html">Контакти</a>
        </div>
    </div>

    <div class="nav-right">
        <a href="admin.html" id="admin-btn" style="display: none; color: #a5b4fc; text-decoration: none; font-weight: 500;">Админ</a>
        <span id="user-display"></span>
        <button id="btn-logout" style="display: none;">Изход</button>
    </div>
</nav>

<div class="container">
    <h1>Моите резервации</h1>
    <div id="tickets-container"></div>
</div>
<footer><p style="text-align: center; color: var(--text-muted); margin-top: 50px;">&copy; 2026 SkyTickets.</p></footer>

<script type="module">
    import { auth, db } from './firebase-config.js';
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
    import { collection, query, where, getDocs, doc, deleteDoc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

    // UI Helper
    const UI = {
        success: (title, msg) => Swal.fire({ title: title, text: msg, icon: 'success', confirmButtonText: 'Благодаря!' }),
        error: (title, msg) => Swal.fire({ title: title, text: msg, icon: 'error', confirmButtonText: 'Ок' }),
        confirm: (title, text) => Swal.fire({
            title: title, text: text, icon: 'warning',
            showCancelButton: true, confirmButtonText: 'Да, върни билета', cancelButtonText: 'Отказ'
        })
    };

    onAuthStateChanged(auth, async (user) => {
        const d = document.getElementById('user-display');
        const out = document.getElementById('btn-logout');
        const adm = document.getElementById('admin-btn');

        if (user) {
            d.innerHTML = `<a href="profile.html" style="color:#a5b4fc; text-decoration:none; font-weight:bold;">👤 ${user.email.split('@')[0]}</a>`;
            out.style.display = "block";
            
            try { 
                const u = await getDoc(doc(db, "users", user.uid)); 
                if (u.exists() && u.data().role === "admin") adm.style.display = "inline-block"; 
            } catch(e) {}

            loadTickets(user.uid);

        } else {
            window.location.href = "login.html";
        }
    });

    async function loadTickets(userId) {
        const container = document.getElementById('tickets-container');
        container.innerHTML = "<p style='text-align:center'>Зареждане на билети...</p>";
        
        try {
            const q = query(collection(db, "orders"), where("userId", "==", userId));
            const querySnapshot = await getDocs(q);

            if (querySnapshot.empty) { 
                container.innerHTML = "<div style='text-align:center; padding:40px; opacity:0.7; background:rgba(255,255,255,0.05); border-radius:20px;'>Все още нямате закупени билети. <br><a href='index.html' style='color:#a5b4fc; margin-top:10px; display:inline-block;'>Намери полет</a></div>"; 
                return; 
            }

            container.innerHTML = ""; 
            let ticketsData = [];

            for (const orderDoc of querySnapshot.docs) {
                const order = orderDoc.data();
                const orderId = orderDoc.id;
                
                let depTime = "??:??"; let arrTime = "??:??"; let returnDateInfo = "";

                try {
                    const flightRef = doc(db, "flights", order.flightId);
                    const flightSnap = await getDoc(flightRef);
                    if (flightSnap.exists()) {
                        const fData = flightSnap.data();
                        depTime = fData.depTime || "00:00"; arrTime = fData.arrTime || "00:00";
                        if (order.type === 'round' && fData.returnDate) returnDateInfo = ` | 🔙 Връщане: ${fData.returnDate}`;
                    } else {
                        depTime = "--:--"; arrTime = "--:--"; returnDateInfo = " (Архивиран полет)";
                    }
                } catch (e) { console.log("Грешка при полет: " + e); }

                let typeBadge = order.type === 'round' ? '<span class="badge" style="background: #667eea; color:white;">ДВУПОСОЧЕН</span>' : '<span class="badge">ЕДНОПОСОЧЕН</span>';
                let tariffBadge = order.tariff ? `<div style="font-size:12px; color:#2ed573; margin-top:5px;">Тарифа: ${order.tariff}</div>` : '';
                
                ticketsData.push(orderId);

                container.innerHTML += `
                    <div class="ticket-card">
                        <div class="ticket-info">
                            ${typeBadge}
                            <div class="route" style="margin-top:10px;">${order.flightFrom} ➔ ${order.flightTo}</div>
                            <div class="flight-time">${depTime} <span style="font-size:16px; opacity:0.6">➜</span> ${arrTime}</div>
                            <div class="dates">📅 Дата: ${order.date} ${returnDateInfo}</div>
                            ${tariffBadge}
                            <div style="font-size:12px; opacity:0.5; margin-top:5px;">Ticket ID: #${orderId}</div>
                        </div>
                        <div class="ticket-action">
                            <div class="price">${order.price} €</div>
                            <div class="qr-box" id="qrcode-${orderId}"></div>
                            <button class="cancel-btn" onclick="cancelTicket('${orderId}', '${order.flightId}')">Отказ</button>
                        </div>
                    </div>
                `;
            }

            setTimeout(() => {
                ticketsData.forEach(id => {
                    const qrContainer = document.getElementById(`qrcode-${id}`);
                    if (qrContainer) {
                        qrContainer.innerHTML = ""; 
                        new QRCode(qrContainer, { text: id, width: 80, height: 80, colorDark : "#000000", colorLight : "#ffffff", correctLevel : QRCode.CorrectLevel.H });
                    }
                });
            }, 100);

        } catch (error) { console.error("Грешка при зареждане:", error); container.innerHTML = "<p>Грешка при връзката с базата данни.</p>"; }
    }

    window.cancelTicket = async (orderId, flightId) => {
        const result = await UI.confirm('Сигурни ли сте?', "Искате да върнете този билет? Действието е окончателно!");
        if (result.isConfirmed) {
            try {
                const flightRef = doc(db, "flights", flightId);
                const flightSnap = await getDoc(flightRef);
                if (flightSnap.exists()) {
                    const currentSeats = flightSnap.data().seats;
                    await updateDoc(flightRef, { seats: currentSeats + 1 });
                }
                await deleteDoc(doc(db, "orders", orderId));
                await UI.success('Готово!', 'Билетът е върнат успешно.'); location.reload(); 
            } catch (e) { console.error(e); UI.error('Грешка!', 'Възникна проблем при връщането.'); }
        }
    };

    document.getElementById('btn-logout').onclick = () => signOut(auth).then(() => location.reload());
</script>

</body>
</html>
