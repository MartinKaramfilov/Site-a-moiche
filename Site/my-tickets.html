<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моите Билети | SkyTickets</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.1);
            --border: rgba(255, 255, 255, 0.2);
            --text: #ffffff;
            --text-dim: #cbd5e1;
            --danger: #ff4757;
            --danger-hover: #ff6b81;
        }

        body { 
            font-family: 'Outfit', sans-serif; 
            margin: 0; color: var(--text);
            /* AURORA BACKGROUND - СЪЩИЯТ КАТО В INDEX */
            background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #1a1a2e);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        nav { 
            background: rgba(15, 12, 41, 0.6);
            backdrop-filter: blur(12px);
            height: 80px; padding: 0 8%;
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 1px solid var(--border);
        }
        .logo { font-size: 26px; font-weight: 700; color: white; text-decoration: none; text-shadow: 0 0 20px rgba(255,255,255,0.3); }
        .nav-links a { text-decoration: none; color: var(--text-dim); margin-left: 20px; transition: 0.3s; font-weight: 500; }
        .nav-links a:hover { color: white; }

        .container { max-width: 800px; margin: 60px auto; padding: 0 20px; }
        
        h1 { 
            text-align: center; font-size: 36px; margin-bottom: 40px;
            background: linear-gradient(to right, #ffffff, #a5b4fc);
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }

        /* КАРТИЧКА ЗА БИЛЕТ (GLASS) */
        .ticket-card { 
            background: var(--glass);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            padding: 30px; border-radius: 20px; 
            margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            transition: 0.3s;
        }
        .ticket-card:hover { transform: translateY(-3px); border-color: rgba(255,255,255,0.4); }

        .ticket-info h3 { margin: 0; font-size: 22px; font-weight: 600; color: #fff; }
        .ticket-details { color: var(--text-dim); margin-top: 10px; font-size: 14px; }
        
        .cancel-btn { 
            background: rgba(255, 71, 87, 0.15); color: var(--danger); border: 1px solid var(--danger); 
            padding: 10px 20px; border-radius: 12px; font-weight: 600; cursor: pointer;
            transition: 0.3s;
        }
        .cancel-btn:hover { background: var(--danger); color: white; box-shadow: 0 0 15px var(--danger); }

        .no-orders { text-align: center; color: var(--text-dim); padding: 40px; background: rgba(255,255,255,0.05); border-radius: 20px; }
    </style>
</head>
<body>

<nav>
    <a href="index.html" class="logo">SkyTickets</a>
    <div class="nav-links">
        <a href="index.html">← Обратно към полети</a>
    </div>
</nav>

<div class="container">
    <h1>Вашите резервации</h1>
    <div id="orders-list">
        </div>
</div>

<script type="module">
    import { auth, db } from './firebase-config.js';
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
    import { collection, getDocs, query, where, doc, deleteDoc, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

    const ordersList = document.getElementById('orders-list');

    // 1. ЗАРЕЖДАНЕ НА БИЛЕТИ
    async function loadOrders(userId) {
        ordersList.innerHTML = "<p style='text-align:center; color:#a5b4fc'>Зареждане на билети...</p>";
        const q = query(collection(db, "orders"), where("userId", "==", userId));
        const querySnapshot = await getDocs(q);
        
        ordersList.innerHTML = "";
        
        if (querySnapshot.empty) {
            ordersList.innerHTML = "<div class='no-orders'>Все още нямате закупени билети. <br><a href='index.html' style='color:#a5b4fc; margin-top:10px; display:inline-block;'>Разгледай полети</a></div>";
            return;
        }

        querySnapshot.forEach((orderDoc) => {
            const order = orderDoc.data();
            const orderId = orderDoc.id;

            ordersList.innerHTML += `
                <div class="ticket-card" id="card-${orderId}">
                    <div class="ticket-info">
                        <h3>✈️ ${order.flightFrom} ➔ ${order.flightTo}</h3>
                        <div class="ticket-details">
                            📅 Дата: ${order.date} <br>
                            💰 Цена: ${order.price} лв. <br>
                            🛒 Купен на: ${order.purchaseDate}
                        </div>
                    </div>
                    <div>
                        <button class="cancel-btn" onclick="cancelOrder('${orderId}', '${order.flightId}')">
                            Отказ
                        </button>
                    </div>
                </div>
            `;
        });
    }

    // 2. ОТКАЗВАНЕ НА БИЛЕТ (ВРЪЩАНЕ НА ПАРИ/МЯСТО)
    window.cancelOrder = async (orderId, flightId) => {
        if (!confirm("Сигурни ли сте, че искате да върнете този билет?")) return;

        try {
            // Стъпка А: Връщаме мястото в самолета (+1)
            // Правим проверка дали полетът още съществува
            if (flightId) {
                const flightRef = doc(db, "flights", flightId);
                const flightSnap = await getDoc(flightRef);
                
                if (flightSnap.exists()) {
                    const currentSeats = flightSnap.data().seats;
                    await updateDoc(flightRef, { seats: currentSeats + 1 });
                }
            }

            // Стъпка Б: Изтриваме билета от "orders"
            await deleteDoc(doc(db, "orders", orderId));

            alert("Билетът е върнат успешно!");
            
            // Презареждаме списъка
            const user = auth.currentUser;
            if (user) loadOrders(user.uid);

        } catch (error) {
            console.error("Грешка:", error);
            alert("Възникна грешка. Опитайте пак.");
        }
    };

    // 3. ПРОВЕРКА ЗА ВХОД
    onAuthStateChanged(auth, (user) => {
        if (user) {
            loadOrders(user.uid);
        } else {
            // Ако не е логнат, го пращаме да се логне
            window.location.href = "login.html";
        }
    });
</script>

</body>
</html>
